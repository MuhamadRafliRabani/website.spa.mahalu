      :root {

        --font-head: "Playfair Display", serif;

        --font-body: "Inter", sans-serif;
      }

      ::selection {
        background-color: var(--accent);
        color: #ffffff;
      }
      ::-moz-selection {
        background-color: var(--accent);
        color: #ffffff;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Animasi Kemunculan Scroll (Sangat Terasa & Mewah) */
      .gallery-item {
        break-inside: avoid;
        opacity: 0;
        transform: translateY(60px) scale(0.95);
        transition:
          opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .gallery-item.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* Animasi Transisi Gambar Loading -> Muncul */
      .gallery-item img {
        opacity: 0;
        transition:
          opacity 0.6s ease-out,
          transform 2s ease-out;
        will-change: transform, opacity;
      }
      .gallery-item img.loaded {
        opacity: 1;
      }

      /* Filter Buttons */
      .filter-btn {
        transition: all 0.3s ease;
      }
      .filter-btn.active {
        background-color: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }

      /* Reveal standard untuk elemen non-gallery */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      .nav-link-modern {
        color: white;
        position: relative;
        transition: 0.3s;

        /* 🔥 ini penyelamat */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      .nav-link-modern:hover {
        color: var(--accent);
      }

      // --- RENDER GALLERY (Presisi Masonry) ---
      function renderGallery(filter = "all") {
        const container = document.getElementById("gallery-container");
        container.innerHTML = "";

        const filteredData =
          filter === "all"
            ? galleryData
            : galleryData.filter((item) => item.category === filter);

        filteredData.forEach((item, index) => {
          const html = `
            <div class="gallery-item w-full relative rounded-2xl md:rounded-3xl overflow-hidden shadow-sm hover:shadow-xl mb-4 md:mb-6 group bg-muted/10 ${item.aspect}" data-category="${item.category}">
              
              <!-- Placeholder Skeleton -->
              <div class="absolute inset-0 animate-pulse bg-muted/20"></div>

              <!-- TRUE LAZY LOADING -->
              <!-- Hanya didownload saat masuk layar -->
              <img src="${item.src}" alt="${item.alt}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.onerror=null; this.src='${item.fallback}';" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110" />
              
              <!-- Modern Luxury Overlay -->
              <div class="absolute inset-0 bg-gradient-to-t from-text/90 via-text/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-5 md:p-6">
                <div class="transform translate-y-3 group-hover:translate-y-0 transition-transform duration-500 ease-out">
                  <span class="font-body font-semibold tracking-[0.2em] uppercase text-[9px] md:text-[10px] text-bg/80 mb-1 block">
                    ${item.category}
                  </span>
                  <h3 class="font-head text-lg md:text-xl lg:text-2xl text-white leading-tight">${item.title}</h3>
                </div>
              </div>
            </div>
          `;
          container.insertAdjacentHTML("beforeend", html);
        });

        setTimeout(() => {
          initGalleryReveal();
        }, 100);
      }

      // --- FILTER BUTTONS LOGIC ---
      function initFilters() {
        const filterBtns = document.querySelectorAll(".filter-btn");

        filterBtns.forEach((btn) => {
          btn.addEventListener("click", (e) => {
            filterBtns.forEach((b) => b.classList.remove("active"));
            e.target.classList.add("active");

            const filterValue = e.target.getAttribute("data-filter");
            renderGallery(filterValue);
          });
        });
      }

      // Asynchronous Function agar loading Komponen berjalan pararel
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // Render Gallery Awal
          renderGallery("all");
          initFilters();
        } catch (error) {
          console.error("Gagal memuat komponen:", error);
        }
      });

      // --- FUNGSI STAGGERED REVEAL ANIMATION (Mewah & Terasa) ---
      function initGalleryReveal() {
        let delay = 0;
        let timeoutId;

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (
                entry.isIntersecting &&
                !entry.target.classList.contains("show")
              ) {
                // Memberikan delay bertahap untuk efek air terjun / domino
                setTimeout(() => {
                  entry.target.classList.add("show");
                }, delay);

                delay += 100; // Tambah delay untuk item berikutnya
                observer.unobserve(entry.target);

                // Reset delay jika scroll berhenti sebentar
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                  delay = 0;
                }, 150);
              }
            });
          },
          { threshold: 0.1 },
        );

        document.querySelectorAll(".gallery-item").forEach((el) => {
          observer.observe(el);
        });
      }
    </script>
  </body>
</html>
